  <style>
    :root {
      --bg: #080713;
      --bg2: #0d0c1d;
      --panel: #14132a;
      --panel2: #19182f;
      --gold: #ffd52f;
      --gold2: #ff9f1c;
      --blue: #1593ff;
      --cyan: #36d6ff;
      --purple: #8b55ff;
      --pink: #ff3ea5;
      --white: #fbfbff;
      --muted: #a7a5bb;
      --line: rgba(255, 255, 255, .11);
      --display: 'Outfit', sans-serif;
      --body: 'DM Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    html {
      scroll-behavior: smooth
    }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--body);
      overflow-x: hidden
    }

    a {
      text-decoration: none;
      color: inherit
    }

    button {
      font: inherit
    }

    .wrap {
      width: min(1240px, calc(100% - 48px));
      margin: auto
    }

    h1,
    h2,
    h3 {
      font-family: var(--display);
      line-height: 1.02;
      letter-spacing: -.04em
    }

    nav {
      height: 72px;
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(7, 7, 17, .84);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line)
    }

    .nav-inner {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px
    }

    .nav-inner>.btn {
      white-space: nowrap
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      line-height: 0
    }

    .site-logo {
      display: block;
      width: 150px;
      height: auto;
      max-height: 48px;
      object-fit: contain
    }

    .logo span {
      color: #fff
    }

    .logo span b {
      color: var(--gold)
    }

    .nav-links {
      display: flex;
      gap: 30px;
      color: #b6b4c9;
      font-weight: 700;
      font-size: 14px
    }

    .nav-links a:hover {
      color: #fff
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 13px 21px;
      border-radius: 11px;
      font: 800 14px var(--display);
      border: 1px solid transparent;
      cursor: pointer;
      transition: .2s
    }

    .btn-blue {
      background: linear-gradient(135deg, #1c9aff, #0672e8);
      box-shadow: 0 9px 28px rgba(21, 147, 255, .27)
    }

    .btn-blue:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 35px rgba(21, 147, 255, .38)
    }

    .btn-gold {
      background: linear-gradient(135deg, #ffe46a, #ffc51e);
      color: #201500;
      box-shadow: 0 10px 32px rgba(255, 197, 30, .24)
    }

    .btn-outline {
      border-color: rgba(255, 255, 255, .2);
      background: rgba(255, 255, 255, .025);
      color: #fffbfbf1;
    }

    .hero {
      position: relative;
      min-height: 670px;
      overflow: hidden;
      padding: 55px 0 30px;
      background:
        radial-gradient(45% 70% at 78% 44%, rgba(255, 177, 20, .17), transparent 65%),
        radial-gradient(38% 60% at 53% 30%, rgba(34, 105, 255, .18), transparent 70%),
        linear-gradient(135deg, #080713 0%, #0b1020 58%, #110d20 100%)
    }

    .hero:before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(100, 160, 255, .045) 1px, transparent 1px), linear-gradient(90deg, rgba(100, 160, 255, .045) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: linear-gradient(to right, #000, transparent 95%)
    }

    .hero:after {
      content: "";
      position: absolute;
      right: -10%;
      top: -25%;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 190, 35, .11), transparent 67%);
      filter: blur(25px)
    }

    .hero-grid {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 43% 57%;
      align-items: center;
      min-height: 580px
    }

    .hero-copy {
      padding-left: 25px
    }

    .eyebrow {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 7px 13px;
      border: 1px solid rgba(255, 213, 47, .42);
      background: rgba(255, 213, 47, .07);
      border-radius: 999px;
      color: var(--gold);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .08em
    }

    .eyebrow i {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #51e47d;
      box-shadow: 0 0 12px #51e47d
    }

    .hero h1 {
      font-size: clamp(54px, 6vw, 86px);
      margin-top: 20px;
      text-transform: uppercase
    }

    .hero h1 span {
      display: block;
      color: var(--gold);
      font-style: italic;
      text-shadow: 0 0 24px rgba(255, 213, 47, .22)
    }

    .hero-copy>p {
      margin-top: 22px;
      max-width: 520px;
      color: #c6c4d5;
      font-size: 17px;
      line-height: 1.55
    }

    .hero-copy>p b {
      color: var(--gold)
    }

    .hero-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 28px
    }

    .hero-note {
      font-size: 12px !important;
      color: #79768e !important;
      margin-top: 12px !important
    }

    .trust-row {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      margin-top: 25px;
      color: #deddea;
      font-size: 12px;
      font-weight: 700
    }

    .trust-row span {
      display: flex;
      align-items: center;
      gap: 7px
    }

    .trust-row strong {
      color: var(--gold);
      font-size: 16px
    }

    .lottery-scene {
      position: relative;
      height: 570px
    }

    .glow-orb {
      position: absolute;
      width: 470px;
      height: 470px;
      right: 7%;
      top: 4%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(29, 151, 255, .25), rgba(255, 181, 20, .11) 42%, transparent 68%);
      filter: blur(8px)
    }

    .machine {
      position: absolute;
      width: 440px;
      height: 430px;
      right: 10%;
      top: 48px
    }

    .machine-glass {
      position: absolute;
      width: 310px;
      height: 310px;
      left: 63px;
      top: 18px;
      border-radius: 50%;

    .machine-glass:after {
      content: "";
      position: absolute;
      inset: 15px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 50%
    }

    .base {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 20px;
      height: 105px;
      border-radius: 26px;
      background: linear-gradient(160deg, #28203c, #0b0b18);
      border: 2px solid rgba(255, 196, 27, .72);
      box-shadow: 0 20px 40px rgba(0, 0, 0, .55), 0 0 30px rgba(255, 196, 27, .18);

      align-items: end;

    .base:before {
      content: "";

      right: 20px;
      height: 16px;
      border-radius: 50%;
      background: #f1a51e;
      filter: blur(5px);
      opacity: .6
    }

    .base span {
      font: 800 19px var(--display);
      color: var(--gold);
      letter-spacing: .08em
    }

    .crown {
      position: absolute;
      top: -2px;
      right: 38px;
      font-size: 57px;
      color: var(--gold);
      filter: drop-shadow(0 0 14px rgba(255, 213, 47, .7));
      z-index: 4;
      transform: rotate(5deg)

    .ball {
      position: absolute;
      width: 65px;
      height: 65px;
      border-radius: 50%;

      place-items: center;
      font: 900 22px var(--display);

      background: radial-gradient(circle at 30% 25%, #fff, #ffd84e 32%, #f29b13 72%);

    .ball.blue {
      background: radial-gradient(circle at 30% 25%, #fff, #6bd5ff 23%, #1478ef 68%);
      color: #fff
    }

    .ball.purple {
      background: radial-gradient(circle at 30% 25%, #fff, #be7dff 23%, #7040d7 70%);
      color: #fff
    }

    .b1 {
      left: 2px;
      top: 115px
    }

    .b2 {
      right: 3px;
      top: 110px
    }

    .b3 {
      left: 16px;
      bottom: 135px
    }

    .b4 {
      right: 34px;
      bottom: 135px
    }

    .b5 {
      left: 170px;
      bottom: 72px
    }

    .b6 {
      left: 185px;
      top: 80px
    }

    .machine-label {
      position: absolute;
      z-index: 5;
      left: 98px;
      top: 138px;
      width: 240px;
      text-align: center;
      padding: 15px 10px;
      border-radius: 14px;
      background: rgba(7, 9, 20, .9);
      border: 1px solid rgba(255, 213, 47, .45);
      box-shadow: 0 0 28px rgba(255, 213, 47, .18)

    .machine-label small {
      font-size: 11px;
      font-weight: 800;
      color: #eee
    }

    .machine-label strong {
      display: block;
      color: var(--gold);
      font: 900 43px var(--display);
      text-shadow: 0 0 16px rgba(255, 213, 47, .55)
    }

    .machine-label b {
      font-size: 11px;
      letter-spacing: .09em
    }

    .machine-label .count {
      display: flex;
      gap: 5px;
      justify-content: center;
      margin-top: 9px
    }

    .count em {
      font-style: normal;
      background: #17182b;
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 6px 8px;
      font: 800 14px var(--display)
    }

    .count i {
      display: block;
      font: 700 7px var(--body);
      color: #8d8aa0
    }

    .luck-card {
      position: absolute;
      right: -15px;
      top: 235px;
      z-index: 6;
      transform: rotate(5deg);
      width: 145px;
      padding: 17px 13px;
      background: linear-gradient(145deg, #ffe59a, #e9a928);
      color: #271a05;
      border: 3px solid #ffc82e;
      box-shadow: 0 16px 30px rgba(0, 0, 0, .35);
      text-align: center
    }

    .luck-card strong {
      font: 900 19px var(--display);
      text-transform: uppercase;
      line-height: 1.05
    }

    .luck-card small {
      display: block;
      margin-top: 9px;
      font-weight: 800;
      font-size: 10px
    }

    .stat-strip {
      position: relative;
      z-index: 5;
      margin-top: -3px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: rgba(13, 12, 29, .94)
    }

    .stat-inner {
      display: grid;
      grid-template-columns: 1fr 1.5fr 1fr;
      align-items: center;
      min-height: 105px
    }

    .stat-title {
      font-weight: 800;
      font-size: 14px
    }

    .stat-title span {
      color: var(--gold)
    }

    .countdown {
      display: flex;
      gap: 8px;
      justify-content: center
    }

    .timebox {
      min-width: 76px;
      padding: 10px 6px;
      border-radius: 10px;
      text-align: center;
      background: #13162b;
      border: 1px solid rgba(70, 117, 220, .27);
      box-shadow: inset 0 0 18px rgba(21, 147, 255, .08)
    }

    .timebox b {
      display: block;
      font: 900 22px var(--display)
    }

    .timebox small {
      color: #8f8ca3;
      font-size: 9px;
      text-transform: uppercase
    }

    .community {
      justify-self: end;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: #121329;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .avatars {
      display: flex
    }

    .avatars i {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--blue), var(--purple));
      border: 2px solid #121329;
      margin-left: -7px
    }

    .avatars i:first-child {
      margin-left: 0
    }

    .community b {
      display: block;
      font-size: 13px
    }

    .community small {
      color: #55dd82;
      font-size: 10px;
      font-weight: 700
    }

    section {
      padding: 92px 0
    }

    .section-title {
      font-size: clamp(35px, 4vw, 54px)
    }

    .section-sub {
      margin-top: 12px;
      color: var(--muted);
      max-width: 620px
    }

    .how {
      background: linear-gradient(120deg, #090917, #0b1022)
    }

    .how-grid {
      display: grid;
      grid-template-columns: .82fr 1.18fr;
      gap: 50px;
      align-items: center
    }

    .steps {
      margin-top: 30px;
      display: grid;
      gap: 13px
    }

    .step {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 14px;
      align-items: center;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, .025)
    }

    .step-num {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(21, 147, 255, .14);
      border: 1px solid rgba(21, 147, 255, .4);
      color: var(--cyan);
      font-weight: 900
    }

    .step b {
      font: 800 15px var(--display)
    }

    .step p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px
    }

    .game-visual {
      height: 390px;
      border-radius: 26px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at 70% 30%, rgba(28, 154, 255, .3), transparent 27%),
        linear-gradient(135deg, #121b36, #090b18);
      border: 1px solid rgba(54, 214, 255, .25);
      box-shadow: 0 30px 70px rgba(0, 0, 0, .35)
    }

    .game-visual:before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(110deg, transparent 35%, rgba(255, 255, 255, .05) 36%, transparent 37%);
      background-size: 80px 80px
    }

    .avatar {
      position: absolute;
      right: 11%;
      bottom: -15px;
      width: 230px;
      height: 300px;
      border-radius: 45% 45% 12% 12%;
      background: linear-gradient(145deg, #172e57, #0a0e19);
      box-shadow: -25px 0 60px rgba(31, 136, 255, .23)
    }

    .avatar:before {
      content: "";
      position: absolute;
      width: 112px;
      height: 112px;
      border-radius: 50%;
      background: #111c31;
      left: 58px;
      top: -45px;
      border: 5px solid #202d49;
      box-shadow: 0 0 28px rgba(54, 214, 255, .3)
    }

    .avatar:after {
      content: "";
      position: absolute;
      width: 130px;
      height: 35px;
      border-radius: 50%;
      border: 7px solid #2ca8ff;
      left: 49px;
      top: 7px;
      transform: rotate(-5deg)
    }

    .neon-copy {
      position: absolute;
      left: 38px;
      top: 50px;
      font: 900 42px var(--display);
      text-transform: uppercase;
      transform: rotate(-5deg);
      text-shadow: 0 0 22px rgba(54, 214, 255, .4)
    }

    .neon-copy span {
      display: block;
      color: var(--cyan);
      font-style: italic
    }

    .neon-small {
      position: absolute;
      left: 42px;
      bottom: 40px;
      color: #f5f0ff;
      font: 800 12px var(--display);
      letter-spacing: .1em
    }

    .pool {
      background: #0d0c1d
    }

    .pool-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 28px
    }

    .pool-head .section-sub {
      max-width: 500px
    }

    .prize-grid {
      display: grid;
      grid-template-columns: 1.55fr .8fr .8fr;
      gap: 16px
    }

    .prize-card {
      position: relative;
      min-height: 300px;
      overflow: hidden;
      padding: 25px;
      border-radius: 20px;
      background: linear-gradient(145deg, #17233f, #0c1122);
      border: 1px solid rgba(74, 128, 235, .3)
    }

    .prize-card.main {
      background: radial-gradient(circle at 72% 65%, rgba(255, 166, 17, .25), transparent 35%), linear-gradient(145deg, #19294b, #0b1020);
      border-color: rgba(255, 213, 47, .5);
      box-shadow: 0 0 35px rgba(255, 194, 27, .1)
    }

    .prize-tag {
      display: inline-block;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(21, 147, 255, .1);
      border: 1px solid rgba(21, 147, 255, .3);
      color: var(--cyan);
      font-size: 9px;
      font-weight: 900;
      text-transform: uppercase
    }

    .prize-card h3 {
      margin-top: 24px;
      font-size: clamp(39px, 5vw, 69px);
      color: var(--gold);
      text-shadow: 0 0 20px rgba(255, 213, 47, .35)
    }

    .prize-card.main h3 {
      font-size: clamp(52px, 6vw, 82px)
    }

    .prize-card p {
      margin-top: 4px;
      color: #c8c7d7;
      font-size: 13px;
      font-weight: 700
    }

    .prize-art {
      position: absolute;
      right: 25px;
      bottom: 25px;
      font-size: 75px;
      filter: drop-shadow(0 0 20px rgba(255, 200, 25, .35))
    }

    .small-card {
      min-height: 145px
    }

    .small-card h3 {
      font-size: 42px
    }

    .small-card .prize-art {
      font-size: 52px;
      right: 18px;
      bottom: 16px
    }

    .small-card+.small-card {
      margin-top: 10px
    }

    .info-tiles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-top: 16px
    }

    .info {
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #121329;
      display: flex;
      gap: 14px
    }

    .info-icon {
      width: 48px;
      height: 48px;
      flex: none;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: rgba(21, 147, 255, .1);
      color: var(--cyan);
      font-size: 21px
    }

    .info small {
      color: #858299;
      font-size: 10px
    }

    .info b {
      display: block;
      font: 800 16px var(--display);
      margin-top: 2px
    }

    .info p {
      font-size: 10px;
      color: var(--muted);
      margin-top: 3px
    }

    .picker {
      background: radial-gradient(40% 60% at 80% 20%, rgba(120, 73, 255, .14), transparent 70%), #080713
    }

    .picker-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
      margin-bottom: 28px
    }

    .tabs {
      display: flex;
      padding: 4px;
      background: #121329;
      border: 1px solid var(--line);
      border-radius: 11px
    }

    .tabs button {
      border: 0;
      background: transparent;
      color: #8e8ba1;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 800;
      cursor: pointer
    }

    .tabs button.active {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 5px 20px rgba(21, 147, 255, .3)
    }

    .pick-layout {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 17px
    }

    .number-box,
    .slip {
      background: #11132a;
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 23px
    }

    .pick-label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      font-weight: 800
    }

    .pick-label small {
      color: var(--muted)
    }

    .number-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 10px
    }

    .number-grid button {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .1);
      background: #0b0d1c;
      color: #dfe4f2;
      font-weight: 800;
      cursor: pointer
    }

    .number-grid button.selected {
      background: radial-gradient(circle at 30% 25%, #fff, #55c7ff 16%, #1386ff 62%, #07449e);
      border: 0;
      box-shadow: 0 0 20px rgba(21, 147, 255, .3)
    }

    .pick-actions {
      display: flex;
      gap: 10px;
      margin-top: 17px
    }

    .slip {
      background: linear-gradient(145deg, #18213c, #0f1225);
      position: sticky;
      top: 88px
    }

    .slip h3 {
      font-size: 18px
    }

    .slip-balls {
      display: flex;
      gap: 9px;
      margin: 18px 0
    }

    .slip-ball {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #0a0d1a;
      border: 1px dashed #58627b;
      color: #778198;
      font-weight: 900
    }

    .slip-ball.filled {
      border: 0;
      background: radial-gradient(circle at 30% 25%, #fff, #ffd84e 28%, #e89b13 75%);
      color: #342000
    }

    .slip dl {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
      font-size: 13px
    }

    .slip dt {
      color: var(--muted)
    }

    .slip dd {
      font-weight: 800
    }

    .slip dd.gold {
      color: var(--gold);
      font-size: 17px
    }

    .slip .btn {
      width: 100%;
      margin-top: 18px
    }

    .slip-note {
      text-align: center;
      color: #77748a;
      font-size: 10px;
      margin-top: 10px
    }

    .winners {
      background: #0d0c1d
    }

    .winner-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
      margin-top: 28px
    }

    .winner {
      padding: 17px;
      border-radius: 16px;
      background: #13152a;
      border: 1px solid var(--line);
      display: flex;
      gap: 12px;
      align-items: center
    }

    .winner-avatar {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #334bd8, #8d4df1);
      font-weight: 900
    }

    .winner small {
      display: block;
      color: #77748a;
      font-size: 10px
    }

    .winner b {
      font: 800 13px var(--display)
    }

    .winner b span {
      color: var(--gold)
    }

    .features {
      text-align: center;
      background: #080713
    }

    .feature-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 25px;
      margin-top: 40px
    }

    .feature-icon {
      width: 72px;
      height: 72px;
      margin: auto auto 14px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 29px;
      background: #15142a;
      border: 1px solid var(--line);
      box-shadow: 0 0 30px rgba(139, 85, 255, .13)
    }

    .feature b {
      font: 800 16px var(--display)
    }

    .feature p {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px
    }

    .final {
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: 115px 0;
      background:
        radial-gradient(45% 70% at 50% 100%, rgba(21, 147, 255, .35), transparent 70%),
        radial-gradient(30% 50% at 15% 20%, rgba(139, 85, 255, .16), transparent 70%), #080713
    }

    .final:before {
      content: "";
      position: absolute;
      width: 600px;
      height: 220px;
      left: 50%;
      bottom: -120px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(21, 147, 255, .25);
      filter: blur(50px)
    }

    .final h2 {
      position: relative;
      font-size: clamp(38px, 5vw, 62px);
      max-width: 720px;
      margin: auto
    }

    .final h2 span {
      color: var(--gold)
    }

    .final p {
      position: relative;
      color: #b9b7c9;
      max-width: 590px;
      margin: 16px auto
    }

    .final .btn {
      position: relative;
      margin-top: 17px;
      padding: 17px 31px;
      font-size: 15px
    }

    .legal-note {
      font-size: 10px !important;
      color: #69667b !important;
      margin-top: 20px !important
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 35px 0 25px;
      background: #06060e;
      color: #79768b;
      font-size: 11px
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      gap: 20px
    }

    .footer-links {
      display: flex;
      gap: 22px
    }

    .footer-links a:hover {
      color: #fff
    }

    .footer-bottom {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid var(--line);
      padding-top: 16px;
      margin-top: 20px
    }

    .fab {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 60;
      padding: 16px 11px;
      writing-mode: vertical-rl;
      background: var(--blue);
      border-radius: 12px 0 0 12px;
      font-weight: 900;
      box-shadow: 0 0 25px rgba(21, 147, 255, .35)
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(2, 3, 8, .72);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px
    }

    .modal.open {
      display: flex
    }

    .modal-card {
      width: min(440px, 100%);
      padding: 26px;
      border-radius: 22px;
      background: #15182d;
      border: 1px solid rgba(54, 214, 255, .25);
      box-shadow: 0 30px 80px rgba(0, 0, 0, .6)
    }

    .modal-card h3 {
      font-size: 27px
    }

    .modal-card p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 8px
    }

    .modal-actions {
      display: grid;
      gap: 10px;
      margin-top: 20px
    }

    .close {
      float: right;
      border: 0;
      background: none;
      color: #8d8a9e;
      font-size: 24px;
      cursor: pointer
    }

    .play-popup {
      position: fixed;
      inset: 0;
      z-index: 120;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(3, 4, 12, .78);
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity .25s ease, visibility .25s ease;
    }

    .play-popup.show {
      opacity: 1;
      visibility: visible;
      pointer-events: auto
    }

    .play-popup-card {
      position: relative;
      width: min(430px, 100%);
      padding: 25px 24px 22px;
      text-align: center;
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 0, rgba(255, 213, 47, .14), transparent 32%),
        linear-gradient(145deg, #172342, #0d1022);
      border: 1px solid rgba(255, 213, 47, .38);
      box-shadow: 0 30px 90px rgba(0, 0, 0, .7), 0 0 45px rgba(21, 147, 255, .17);
      transform: translateY(14px) scale(.97);
      transition: transform .25s ease;
    }

    .play-popup.show .play-popup-card {
      transform: none
    }

    .popup-close {
      position: absolute;
      right: 13px;
      top: 10px;
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: rgba(255, 255, 255, .04);
      color: #aaa7ba;
      font-size: 22px;
      cursor: pointer;
    }

    .popup-logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 11px
    }

    .popup-logo-wrap img {
      width: 135px;
      height: auto;
      max-height: 46px;
      object-fit: contain
    }

    .popup-badge {
      display: inline-flex;
      padding: 6px 11px;
      border-radius: 999px;
      background: rgba(255, 213, 47, .08);
      border: 1px solid rgba(255, 213, 47, .35);
      color: var(--gold);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .08em
    }

    .play-popup-card h3 {
      font-size: 30px;
      margin-top: 13px
    }

    .play-popup-card>p {
      margin: 8px auto 16px;
      color: #aaa9bd;
      font-size: 13px;
      max-width: 350px
    }

    .popup-prize {
      padding: 15px 12px;
      border-radius: 16px;
      background: rgba(5, 7, 18, .55);
      border: 1px solid rgba(255, 213, 47, .42);
      box-shadow: 0 0 25px rgba(255, 213, 47, .08)
    }

    .popup-prize span {
      display: block;
      color: #d7d6e0;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: .12em
    }

    .popup-prize strong {
      display: block;
      margin: 3px 0;
      color: var(--gold);
      font: 900 42px var(--display);
      text-shadow: 0 0 18px rgba(255, 213, 47, .4)
    }

    .popup-prize small {
      color: #88859a;
      font-size: 10px
    }

    .popup-points {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin: 14px 0;
      color: #d6d5df;
      font-size: 10px;
      font-weight: 800
    }

    .popup-points span:first-child {
      color: #65e28a
    }

    .popup-cta {
      width: 100%;
      padding: 15px 20px;
      font-size: 15px
    }

    .popup-later {
      margin-top: 12px;
      border: 0;
      background: none;
      color: #777489;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer
    }

    .popup-later:hover {
      color: #fff
    }

    @media(max-width:1050px) {
      .hero-grid {
        grid-template-columns: 1fr
      }

      .hero-copy {
        padding: 20px 0;
        text-align: center
      }

      .hero-copy>p {
        margin-left: auto;
        margin-right: auto
      }

      .hero-actions,
      .trust-row {
        justify-content: center
      }

      .lottery-scene {
        height: 520px
      }

      .machine {
        right: 50%;
        transform: translateX(50%) scale(.9)
      }

      .stat-inner {
        grid-template-columns: 1fr 1.6fr
      }

      .community {
        display: none
      }

      .prize-grid {
        grid-template-columns: 1fr 1fr
      }

      .prize-card.main {
        grid-row: span 2
      }

      .winner-grid {
        grid-template-columns: 1fr 1fr
      }

      .feature-grid {
        grid-template-columns: 1fr 1fr
      }
    }

    @media(max-width:720px) {
      .site-logo {
        width: 110px
      }

      .play-popup-card {
        padding: 22px 18px 18px
      }

      .play-popup-card h3 {
        font-size: 26px
      }

      .popup-prize strong {
        font-size: 35px
      }

      .wrap {
        width: min(100% - 30px, 1240px)
      }

      nav {
        height: 64px
      }

      .nav-links {
        display: none
      }

      .nav-inner>.btn {
        padding: 9px 11px;
        font-size: 11px
      }

      .hero {
        padding-top: 30px
      }

      .hero h1 {
        font-size: 47px
      }

      .hero-copy>p {
        font-size: 14px
      }

      .lottery-scene {
        height: 390px
      }

      .machine {
        transform: translateX(50%) scale(.67);
        transform-origin: top center;
        top: 0
      }

      .glow-orb {
        width: 330px;
        height: 330px;
        right: 0
      }

      .stat-inner {
        display: block;
        padding: 18px 0
      }

      .countdown {
        margin-top: 12px
      }

      .timebox {
        min-width: 0;
        flex: 1
      }

      .timebox b {
        font-size: 18px
      }

      .pool-head,
      .picker-head {
        display: block
      }

      .tabs {
        margin-top: 18px
      }

      .how-grid,
      .pick-layout {
        grid-template-columns: 1fr
      }

      .game-visual {
        height: 300px
      }

      .prize-grid {
        grid-template-columns: 1fr
      }

      .prize-card.main {
        grid-row: auto;
        min-height: 300px
      }

      .small-card+.small-card {
        margin-top: 0
      }

      .info-tiles {
        grid-template-columns: 1fr
      }

      .number-grid {
        grid-template-columns: repeat(5, 1fr)
      }

      .slip {

        top: 0
      }

      }

      .footer-top,

      }

      .footer-links {

      }

    /* ================= v4 additions ================= */

    /* ---- Arabic / RTL ---- */
    html[lang="ar"] {
      --display: 'Cairo', 'Outfit', sans-serif;
      --body: 'Cairo', 'DM Sans', sans-serif
    }

    html[lang="ar"] h1,
    html[lang="ar"] h2,
    html[lang="ar"] h3 {
      letter-spacing: 0;
      line-height: 1.22
    }

    html[lang="ar"] .hero h1 {
      line-height: 1.12
    }

    html[lang="ar"] .hero h1 span,
    html[lang="ar"] .neon-copy span {
      font-style: normal
    }

    html[lang="ar"] .eyebrow,
    html[lang="ar"] .base span,
    html[lang="ar"] .machine-label b,
    html[lang="ar"] .neon-small,
    html[lang="ar"] .popup-badge,
    html[lang="ar"] .popup-prize span,
    html[lang="ar"] .prize-tag {
      letter-spacing: 0
    }

    html[lang="ar"] .neon-copy {
      line-height: 1.25
    }

    bdi.num {
      unicode-bidi: isolate;
      direction: ltr
    }

    [dir="rtl"] .hero-copy {
      padding-left: 0;
      padding-right: 25px
    }

    [dir="rtl"] .fab {
      right: auto;
      left: 0;
      border-radius: 0 12px 12px 0
    }

    [dir="rtl"] .popup-close {
      right: auto;
      left: 13px
    }

    [dir="rtl"] .close {
      float: left
    }

    /* ---- Header language toggle ---- */
    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .nav-right .btn {
      white-space: nowrap
    }

    .lang-toggle {
      min-width: 52px;
      height: 42px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 213, 47, .45);
      background: rgba(255, 213, 47, .08);
      color: var(--gold);
      font: 800 14px 'Cairo', 'DM Sans', sans-serif;
      cursor: pointer;
      transition: .2s
    }

    .lang-toggle:hover {
      background: rgba(255, 213, 47, .16)
    }

    /* ---- Hero lead form ---- */
    .lead-wrap {
      grid-column: 1 / -1;
      position: relative;
      z-index: 6;
      margin-top: 22px
    }

    .fab {
      transition: opacity .25s ease
    }

    .lead-card {
      position: relative;
      padding: 22px 24px 18px;
      border-radius: 22px;
      background: linear-gradient(145deg, rgba(23, 35, 66, .94), rgba(12, 15, 32, .96));
      border: 1px solid rgba(255, 213, 47, .4);
      box-shadow: 0 25px 60px rgba(0, 0, 0, .45), 0 0 45px rgba(21, 147, 255, .12)
    }

    .lead-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 16px
    }

    .lead-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(81, 228, 125, .12);
      border: 1px solid rgba(81, 228, 125, .45);
      color: #65e28a;
      font-size: 11px;
      font-weight: 900;
      margin-bottom: 8px
    }

    .lead-head h3 {
      font-size: 24px
    }

    .lead-head p {
      color: var(--muted);
      font-size: 13px;
      margin-top: 5px
    }

    .lead-proof {
      color: #8f8ca3;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap
    }

    .lead-form {
      display: grid;
      grid-template-columns: 1fr 1.35fr 1fr auto;
      gap: 10px;
      align-items: start
    }

    .lead-form input[type="text"],
    .lead-form input[type="tel"],
    .lead-form input[type="email"],
    .lead-form select {
      width: 100%;
      height: 52px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, .14);
      background: #0b0d1c;
      color: #fff;
      padding: 0 14px;
      font: 600 15px var(--body);
      outline: none;
      transition: border-color .2s, box-shadow .2s
    }

    .lead-form input::placeholder {
      color: #6f6c85
    }

    .lead-form input:focus,
    .lead-form select:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(255, 213, 47, .16)
    }

    .phone-row {
      display: flex;
      gap: 8px;
      direction: ltr
    }

    .phone-row select {
      width: 112px;
      flex: none;
      padding: 0 8px;
      cursor: pointer
    }

    [dir="rtl"] .phone-row input::placeholder {
      text-align: right
    }

    .lead-submit {
      height: 52px;
      padding: 0 24px;
      font-size: 15px;
      white-space: nowrap
    }

    .lead-submit[disabled] {
      opacity: .7;
      cursor: wait
    }

    .consent-field {
      grid-column: 1 / -1
    }

    .consent {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      font-size: 12px;
      color: #b9b7c9;
      line-height: 1.55;
      cursor: pointer
    }

    .consent input {
      width: 18px;
      height: 18px;
      flex: none;
      margin-top: 1px;
      accent-color: #ffc51e;
      cursor: pointer
    }

    .consent a {
      color: var(--gold);
      text-decoration: underline
    }

    .lead-form .err {
      display: none;
      color: #ff7d8e;
      font-size: 11px;
      font-weight: 700;
      margin-top: 5px
    }

    .lead-form .field.invalid .err {
      display: block
    }

    .lead-form .field.invalid input,
    .lead-form .field.invalid select {
      border-color: #ff5d73
    }

    .lead-success {
      display: none;
      text-align: center;
      padding: 8px 0 6px
    }

    .lead-card.done .lead-head,
    .lead-card.done .lead-form {
      display: none
    }

    .lead-card.done .lead-success {
      display: block
    }

    .ok-icon {
      width: 54px;
      height: 54px;
      margin: 0 auto 10px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 26px;
      font-weight: 900;
      color: #0d2a16;
      background: linear-gradient(135deg, #7cf0a0, #3ccf6b);
      box-shadow: 0 0 25px rgba(81, 228, 125, .45)
    }

    .lead-success h3 {
      font-size: 26px
    }

    .lead-success p {
      color: #c6c4d5;
      font-size: 14px;
      margin: 8px auto 16px;
      max-width: 520px
    }

    /* ---- CTA bounce + glowing border ---- */
    @keyframes ctaBounce {
      0%, 60%, 100% { transform: translateY(0) }
      68% { transform: translateY(-7px) }
      76% { transform: translateY(0) }
      82% { transform: translateY(-3px) }
      88% { transform: translateY(0) }
    }

    @keyframes glowGold {
      0%, 100% { box-shadow: 0 0 0 1px rgba(255, 233, 130, .85), 0 0 12px rgba(255, 197, 30, .45), 0 10px 30px rgba(255, 197, 30, .22) }
      50% { box-shadow: 0 0 0 2px rgba(255, 244, 190, 1), 0 0 28px rgba(255, 197, 30, .9), 0 10px 42px rgba(255, 197, 30, .42) }
    }

    @keyframes glowBlue {
      0%, 100% { box-shadow: 0 0 0 1px rgba(120, 220, 255, .8), 0 0 12px rgba(54, 214, 255, .4), 0 9px 28px rgba(21, 147, 255, .25) }
      50% { box-shadow: 0 0 0 2px rgba(190, 240, 255, 1), 0 0 28px rgba(54, 214, 255, .85), 0 9px 40px rgba(21, 147, 255, .45) }
    }

    @keyframes fabNudge {
      0%, 60%, 100% { transform: translateY(-50%) translateX(0) }
      70% { transform: translateY(-50%) translateX(-6px) }
      80% { transform: translateY(-50%) translateX(0) }
    }

    @keyframes fabNudgeRtl {
      0%, 60%, 100% { transform: translateY(-50%) translateX(0) }
      70% { transform: translateY(-50%) translateX(6px) }
      80% { transform: translateY(-50%) translateX(0) }
    }

    .btn-gold.cta-link,
    .lead-submit {
      animation: ctaBounce 2.6s ease-in-out infinite, glowGold 1.8s ease-in-out infinite
    }

    .btn-blue.cta-link {
      animation: ctaBounce 2.6s ease-in-out infinite, glowBlue 1.8s ease-in-out infinite
    }

    .nav-right .cta-link {
      animation-delay: .5s, 0s
    }

    .hero-actions .cta-link {
      animation-delay: .15s, 0s
    }

    .fab {
      animation: fabNudge 2.6s ease-in-out infinite, glowBlue 1.8s ease-in-out infinite
    }

    [dir="rtl"] .fab {
      animation-name: fabNudgeRtl, glowBlue
    }

    .cta-link:hover,
    .lead-submit:hover {
      animation-play-state: paused
    }

    @media (prefers-reduced-motion: reduce) {
      .btn-gold.cta-link,
      .btn-blue.cta-link,
      .lead-submit,
      .fab {
        animation: none
      }
    }

        pp_pt1: "✓ سحوبات يومية", pp_pt2: "✓ النتائج الليلة", pp_pt3: "✓ +18 فقط", pp_later: "ربما لاحقاً",
        md_h3: "العب الآن على Rizoon", md_p: "تابع إلى موقع Rizoon الرسمي لإكمال مشاركتك.", md_change: "تغيير أرقامي",

    };

    // ===== Helpers =====
    let lang = CONFIG.defaultLang, TOK = {};
    const T = k => (I18N[lang][k] !== undefined ? I18N[lang][k] : I18N.en[k]);
    const money = n => CONFIG.currency + Number(n).toLocaleString('en-US', { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 });
    const num = s => `<bdi class="num" dir="ltr">${s}</bdi>`;
    const timeLabel = h => `${h % 12 || 12}:00 ${T('pm')}`;
    const fill = s => s.replace(/\{(\w+)\}/g, (m, k) => (TOK[k] !== undefined ? TOK[k] : m));
    const pad = v => String(v).padStart(2, '0');
    const track = (event, data) => { window.dataLayer = window.dataLayer || []; window.dataLayer.push(Object.assign({ event: event, page_lang: lang }, data || {})); };

    // ===== Language =====
    function applyLang(l) {
      lang = I18N[l] ? l : 'ar';
      const root = document.documentElement;
      root.lang = lang;
      root.dir = lang === 'ar' ? 'rtl' : 'ltr';
      TOK = {
        total: num(money(CONFIG.totalPrize)),
        entry: num(money(Math.min(GAMES.q3.entry, GAMES.p4.entry))),
        e1: num(money(GAMES.q3.entry)), e2: num(money(GAMES.p4.entry)),
        q3prize: num(money(GAMES.q3.prize)), third: num(money(CONFIG.thirdPrize)),
        t1: num(timeLabel(GAMES.q3.hour)), t2: num(timeLabel(GAMES.p4.hour))
      };
      document.querySelectorAll('[data-i18n]').forEach(el => { const v = T(el.dataset.i18n); if (v !== undefined) el.innerHTML = fill(v); });
      document.querySelectorAll('[data-i18n-ph]').forEach(el => { el.placeholder = T(el.dataset.i18nPh); });
      document.querySelectorAll('[data-tok]').forEach(el => { el.innerHTML = TOK[el.dataset.tok]; });
      document.querySelectorAll('.cta-link').forEach(a => { a.textContent = T('cta'); });
      document.querySelectorAll('[data-pol]').forEach(a => { a.href = a.dataset.pol + '?lang=' + lang; });
      document.title = T('meta_title');
      const md = document.querySelector('meta[name="description"]');
      if (md) md.setAttribute('content', T('meta_desc'));
      const tg = document.getElementById('langToggle');
      tg.textContent = T('lang_btn');
      tg.setAttribute('aria-label', T('lang_aria'));
      try { localStorage.setItem('rizoon_lang', lang); } catch (e) { }
      render(); renderWinners(); countdown();
    }

    // Apply URL + tracking to every CTA button (text is set per language in applyLang)
    document.querySelectorAll('.cta-link').forEach(a => {
      a.href = CONFIG.ctaUrl;
      if (CONFIG.openInNewTab) { a.target = '_blank'; a.rel = 'noopener'; }
      a.addEventListener('click', () => track('rizoon_cta_click', { cta_location: a.dataset.loc || 'unknown' }));
    });

    // ===== Number picker =====
    let game = 'q3', selected = [];
    const grid = document.getElementById('numberGrid');
    const balls = document.getElementById('slipBalls');

    function render() {
      const G = GAMES[game];
      document.getElementById('pickLabel').textContent = T('pick_n').replace('{n}', G.pick);
      document.getElementById('pickCount').textContent = `${selected.length} / ${G.pick}`;
      document.getElementById('slipTitle').textContent = T('slip_title').replace('{game}', G.name);
      document.getElementById('slipEntry').innerHTML = num(money(G.entry));
      document.getElementById('slipPrize').innerHTML = num(money(G.prize));
      document.getElementById('slipDraw').innerHTML = num(timeLabel(G.hour));

      grid.innerHTML = '';
      for (let n = 0; n <= G.max; n++) {
        const b = document.createElement('button');
        b.textContent = pad(n);
        if (selected.includes(n)) b.classList.add('selected');
        if (selected.length >= G.pick && !selected.includes(n)) b.disabled = true;
        b.onclick = () => {
          if (selected.includes(n)) selected = selected.filter(x => x !== n);
          else if (selected.length < G.pick) selected.push(n);
          render();
        };
        grid.appendChild(b);
      }

      balls.innerHTML = '';
      for (let i = 0; i < G.pick; i++) {
        const b = document.createElement('div');
        b.className = 'slip-ball' + (selected[i] !== undefined ? ' filled' : '');
        b.textContent = selected[i] !== undefined ? pad(selected[i]) : '—';
        balls.appendChild(b);
      }
    }

    document.querySelectorAll('.tabs button').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('.tabs button').forEach(x => x.classList.remove('active'));
        btn.classList.add('active');
        game = btn.dataset.game;
        selected = [];
        render();
      };
    });
    document.getElementById('randomBtn').onclick = () => {
      const G = GAMES[game], s = new Set();
      while (s.size < G.pick) s.add(Math.floor(Math.random() * (G.max + 1)));
      selected = [...s]; render();
    };
    document.getElementById('clearBtn').onclick = () => { selected = []; render(); };

    // ===== Countdown to the next draw (GST), same for every visitor =====
    function countdown() {
      const off = CONFIG.drawTzOffsetHours * 3600e3, nowMs = Date.now(), d = new Date(nowMs + off);
      const draws = Object.values(GAMES).sort((a, b) => a.hour - b.hour);
      let next;
      for (let add = 0; add < 2 && !next; add++) {
        for (const g of draws) {
          const t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() + add, g.hour, 0) - off;
          if (t > nowMs) { next = { name: g.name, ms: t - nowMs }; break; }
        }
      }
      const s = Math.max(0, Math.floor(next.ms / 1000));
      const vals = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60].map(pad);
      document.querySelectorAll('#clock .timebox b').forEach((x, i) => x.textContent = vals[i]);
      document.querySelectorAll('#miniClock em').forEach((x, i) => x.firstChild.nodeValue = vals[i]);
      const nn = document.getElementById('nextName');
      if (nn) nn.textContent = next.name;
    }
    setInterval(countdown, 1000);

    // ===== Recent winners =====
    function renderWinners() {
      const wg = document.getElementById('winnerGrid');
      if (!CONFIG.winners.length) { document.getElementById('navWinners').style.display = 'none'; return; }
      wg.innerHTML = '';
      CONFIG.winners.slice(0, 9).forEach(w => {
        const el = document.createElement('div');
        el.className = 'winner';
        el.innerHTML = `<div class="winner-avatar"></div><div><small></small><b>${T('won')} <span>${num(money(w.amount))}</span></b><small></small></div>`;
        el.querySelector('.winner-avatar').textContent = lang === 'ar' ? w.initials_ar : w.initials;
        const sm = el.querySelectorAll('small');
        sm[0].textContent = lang === 'ar' ? w.name_ar : w.name;
        sm[1].textContent = [T('tier_' + w.tier), w.date].filter(Boolean).join(' · ') || T('recent');
        wg.appendChild(el);
      });
      document.getElementById('winners').hidden = false;
    }

    // ===== Lead form =====
    const leadForm = document.getElementById('leadForm');
    const codeSel = document.getElementById('lfCode');
    CONFIG.countries.forEach(c => {
      const o = document.createElement('option');
      o.value = c.code; o.textContent = `${c.flag} +${c.code}`;
      codeSel.appendChild(o);
    });

    function setInvalid(f, bad) { leadForm.querySelector(`.field[data-f="${f}"]`).classList.toggle('invalid', bad); }

    function validate() {
      const name = document.getElementById('lfName').value.trim();
      const c = CONFIG.countries.find(x => x.code === codeSel.value);
      let phone = document.getElementById('lfPhone').value.replace(/\D/g, '');
      if (phone.startsWith(c.code)) phone = phone.slice(c.code.length);
      phone = phone.replace(/^0+/, '');
      const email = document.getElementById('lfEmail').value.trim();
      const consent = document.getElementById('lfConsent').checked;
      const ok = {
        name: name.length >= 2,
        phone: phone.length === c.len,
        email: !email || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email),
        consent: consent
      };
      Object.keys(ok).forEach(k => setInvalid(k, !ok[k]));
      return { valid: Object.values(ok).every(Boolean), data: { name, phone: '+' + c.code + phone, country_code: '+' + c.code, email } };
    }

    leadForm.querySelectorAll('input, select').forEach(el => {
      el.addEventListener('input', () => { const f = el.closest('.field'); if (f && f.classList.contains('invalid')) validate(); });
    });

    leadForm.addEventListener('submit', e => {
      e.preventDefault();
      const res = validate();
      if (!res.valid) {
        const first = leadForm.querySelector('.field.invalid input');
        if (first) first.focus();
        track('lead_form_error');
        return;
      }
      const btn = document.getElementById('lfSubmit');
      btn.disabled = true;
      const qs = new URLSearchParams(location.search);
      const payload = Object.assign({}, res.data, {
        lang: lang,
        page: location.href.split('#')[0],
        submitted_at: new Date().toISOString(),
        utm_source: qs.get('utm_source') || '', utm_medium: qs.get('utm_medium') || '',
        utm_campaign: qs.get('utm_campaign') || '', utm_content: qs.get('utm_content') || '',
        fbclid: qs.get('fbclid') || ''
      });
      const done = () => {
        document.getElementById('leadCard').classList.add('done');
        track('lead_submit', { lead_country: res.data.country_code });
      };
      if (CONFIG.leadEndpoint) {
        fetch(CONFIG.leadEndpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
          .catch(() => { }).finally(done);
      } else {
        done();
      }
    });

    // Hide the floating side button while the lead form is on screen (tablet/mobile), so it never covers the fields
    if ('IntersectionObserver' in window) {
      const fab = document.querySelector('.fab');
      new IntersectionObserver(es => es.forEach(en => fab.classList.toggle('fab-off', en.isIntersecting)), { threshold: 0.05 })
        .observe(document.getElementById('leadCard'));
    }

    // ===== Language toggle + initial language =====
    document.getElementById('langToggle').addEventListener('click', () => {
      applyLang(lang === 'ar' ? 'en' : 'ar');
      track('language_switch');
    });

    (function initLang() {
      let l = CONFIG.defaultLang;
      const q = new URLSearchParams(location.search).get('lang');
      let saved = null;
      try { saved = localStorage.getItem('rizoon_lang'); } catch (e) { }
      if (q && I18N[q]) l = q; else if (saved && I18N[saved]) l = saved;
      applyLang(l);
    })();

    // ===== Modal =====
    const modal = document.getElementById('modal');
    document.getElementById('closeModal').onclick = () => modal.classList.remove('open');
    document.getElementById('modalPick').onclick = () => modal.classList.remove('open');

    // ===== Popup =====
    const playPopup = document.getElementById('playPopup');
    const popupClose = document.getElementById('popupClose');
    const popupLater = document.getElementById('popupLater');

    function openPlayPopup() {
      // Don't interrupt someone who is filling in the lead form
      if (leadForm.contains(document.activeElement)) { setTimeout(openPlayPopup, 8000); return; }
      if (document.getElementById('leadCard').classList.contains('done')) return;
      playPopup.classList.add('show');
      playPopup.setAttribute('aria-hidden', 'false');
    }
    function closePlayPopup() {
      playPopup.classList.remove('show');
      playPopup.setAttribute('aria-hidden', 'true');
      try { sessionStorage.setItem('Rizoon_popup_closed', '1'); } catch (e) { }
    }
    popupClose.addEventListener('click', closePlayPopup);
    popupLater.addEventListener('click', closePlayPopup);
    playPopup.addEventListener('click', e => { if (e.target === playPopup) closePlayPopup(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayPopup(); });

    // Show the popup once per browser session after a short delay.
    let popupSeen = false;
    try { popupSeen = !!sessionStorage.getItem('Rizoon_popup_closed'); } catch (e) { }
    if (!popupSeen) setTimeout(openPlayPopup, 1800);
  </script>
